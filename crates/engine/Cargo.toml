[package]
name = "engine"
version = "0.1.0"
edition = "2024"

# Winit needs the event loop on the main thread (macOS) and libtest always
# spawns test threads, so the API integration tests run as a plain binary
[[test]]
name = "api"
harness = false

[[example]]
name = "basic"
path = "../../examples/basic/main.rs"

[[example]]
name = "sprite"
path = "../../examples/sprite/main.rs"

[[example]]
name = "animation"
path = "../../examples/animation/main.rs"

[[example]]
name = "input"
path = "../../examples/input/main.rs"

[[example]]
name = "full"
path = "../../examples/full/main.rs"

[[example]]
name = "desktop_pet"
path = "../../examples/desktop_pet/main.rs"
required-features = ["desktop-pet"]

[features]
desktop-pet = ["platform/desktop-pet"]

[dependencies]
platform = { path = "../platform" }
graphics = { path = "../graphics" }
glam = "0.29"
thiserror = "2"
